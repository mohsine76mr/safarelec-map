<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte interactive — ONCF LGV Lot 2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#1f2937}
header{padding:12px 16px;background:#17365d;color:white}
header h1{font-size:18px;margin:0 0 4px} header p{margin:0;font-size:12px}
#controls{padding:10px 16px;background:#f3f6f9;border-bottom:1px solid #d5dde5;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
#map{height:calc(100% - 110px);min-height:400px}
.route-toggle{display:flex;gap:6px;align-items:center;font-size:13px}
.route-toggle span{display:inline-block;width:18px;height:4px}
.small{font-size:12px;color:#555}
</style>
</head>
<body>
<header><h1>Carte interactive — ONCF LGV / Lot 2</h1><p>Les tracés sont chargés depuis routes.json. Ajoutez ou remplacez ce fichier dans le dépôt GitHub pour mettre à jour la carte.</p></header>
<div id="controls"><strong>Circuits :</strong><div id="route-list"></div><span id="status" class="small">Chargement des tracés…</span><span class="small">Utilise la molette pour zoomer et fais glisser la carte pour la déplacer.</span></div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');
const status = document.getElementById('status');
const imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri — Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
  maxZoom: 19
});
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
});
imagery.addTo(map);
L.control.layers({"Satellite":imagery,"Plan de rues":streets}, null, {collapsed:false}).addTo(map);
const bounds = [];
const routeList = document.getElementById('route-list');

function renderRoutes(routes) {
  if (!Array.isArray(routes) || routes.length === 0) {
    status.textContent = "Aucun tracé trouvé dans routes.json.";
    return;
  }
  routes.forEach((route) => {
    let coords;
    try {
      coords = typeof route.coords === 'string' ? JSON.parse(route.coords) : route.coords;
    } catch (e) {
      console.error('Coordonnées illisibles pour', route.name, e);
      return;
    }
    if (!Array.isArray(coords) || coords.length < 2) {
      console.warn('Tracé ignoré : moins de deux points GPS', route.name);
      return;
    }
    const color = route.color || '#E91EBA';
    const line = L.polyline(coords, {color, weight:5, opacity:0.9}).addTo(map);
    line.bindPopup('<b>'+String(route.name || 'Tracé')+'</b><br>Source : '+String(route.file || '')+'<br>Points GPS : '+coords.length);
    const start = L.circleMarker(coords[0], {radius:5,color,fillOpacity:1}).addTo(map).bindPopup('Début du tracé : '+String(route.name || 'Tracé'));
    const end = L.circleMarker(coords[coords.length-1], {radius:5,color,fillOpacity:1}).addTo(map).bindPopup('Fin du tracé : '+String(route.name || 'Tracé'));
    bounds.push(line.getBounds());
    const label = document.createElement('label');
    label.className = 'route-toggle';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.addEventListener('change',()=>{ if(cb.checked){line.addTo(map);start.addTo(map);end.addTo(map)}else{map.removeLayer(line);map.removeLayer(start);map.removeLayer(end)} });
    const swatch=document.createElement('span'); swatch.style.background=color;
    label.appendChild(cb); label.appendChild(swatch); label.appendChild(document.createTextNode((route.name || 'Tracé')+' ('+coords.length+' pts)'));
    routeList.appendChild(label);
  });
  if(bounds.length) {
    let all = bounds[0];
    for(let i=1;i<bounds.length;i++) all=all.extend(bounds[i]);
    map.fitBounds(all.pad(0.08));
    status.textContent = 'Tracés chargés : ' + bounds.length;
  } else {
    status.textContent = 'routes.json a été lu, mais aucun tracé valide (il faut au moins 2 points GPS par tracé).';
  }
}

fetch('./routes.json?refresh=' + Date.now())
  .then(response => {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(renderRoutes)
  .catch(error => {
    console.error('Erreur de chargement routes.json:', error);
    status.textContent = 'Impossible de charger routes.json. Vérifiez qu’il est à la racine du dépôt GitHub et que son JSON est valide.';
  });
</script>
</body>
</html>
